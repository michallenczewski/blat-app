# Tworzy albo odświeża package-lock.json (Blat trzyma go w repozytorium, a w rozmowach z asystentem
# często nie ma dostępu do sieci). Uruchamiane ręcznie; plik trafia od razu na gałąź main.
name: package-lock.json
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --package-lock-only --ignore-scripts
      - name: Wypchnij package-lock.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then echo "Bez zmian"; exit 0; fi
          git commit -m "package-lock.json (wygenerowany w GitHub Actions)"
          git push
