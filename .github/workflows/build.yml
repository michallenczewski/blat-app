name: Buduj instalatory

# Instalatory budują się TYLKO na wyraźne polecenie (Actions → Buduj instalatory → Run workflow albo
# umiejętność `wydanie`), a nie przy każdym wypchnięciu. Repozytorium jest publiczne, więc budowanie nic nie kosztuje.
on:
  workflow_dispatch:
    inputs:
      os:
        description: 'Dla jakiego systemu (win / mac / oba)'
        default: 'oba'

permissions:
  contents: write

# nowe budowanie czeka na poprzednie (nie przerywa go), żeby wydanie nie zostało z połową plików
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      # wydanie powstaje tu, raz; zadania dla Maca i Windows tylko dokładają do niego pliki (bez wyścigu dwóch tworzących)
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(node -p "require('./package.json').version")
          echo "version=$V" >> "$GITHUB_OUTPUT"
          if ! gh release view "v$V" -R "${{ github.repository }}" >/dev/null 2>&1; then
            gh release create "v$V" -R "${{ github.repository }}" --target "${{ github.sha }}" --title "Blat $V" --notes "" --latest
          fi
          echo "Buduję wersję $V"

  build:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        # Mac budujemy na maszynie z Intelem — tych GitHub ma więcej; dmg i tak powstaje dla arm64 i x64
        os: ${{ fromJSON(inputs.os == 'win' && '["windows-latest"]' || inputs.os == 'mac' && '["macos-15-intel"]' || '["macos-15-intel","windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      # z package-lock.json: npm ci (dokładnie te same wersje co ostatnio); bez niego: npm install
      - run: if [ -f package-lock.json ]; then npm ci; else npm install; fi
        shell: bash
      # na maszynach GitHuba XProtect potrafi trzymać obraz dysku i hdiutil nie może go odłączyć
      - name: Zatrzymaj XProtect
        if: runner.os == 'macOS'
        run: sudo pkill -9 XProtect >/dev/null 2>&1 || true; while pgrep XProtect >/dev/null; do sleep 2; done
      # hdiutil na Macu czasem nie może odłączyć obrazu („Resource busy”) — wtedy próbujemy jeszcze dwa razy
      - shell: bash
        run: |
          for i in 1 2 3; do
            npx electron-builder --publish never && exit 0
            echo "Próba $i nieudana, ponawiam"; sudo pkill -9 XProtect >/dev/null 2>&1 || true
            hdiutil info | awk '/\/dev\/disk[0-9]+/{print $1}' | sort -u | xargs -n1 hdiutil detach -force >/dev/null 2>&1 || true
            sleep 15
          done
          exit 1
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      # każdy system dokłada swój instalator do wydania od razu, bez czekania na drugi (--clobber: ponowne budowanie podmienia pliki)
      - name: Dołącz do wydania
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          files=(dist/*.dmg dist/*.zip dist/*.exe)
          [ ${#files[@]} -gt 0 ] || { echo "Brak plików do dołączenia"; exit 1; }
          gh release upload "v${{ needs.check.outputs.version }}" "${files[@]}" --clobber -R "${{ github.repository }}"
