<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' blat: blob: data:; connect-src 'self' blat: blob: data: https:; img-src 'self' blat: blob: data: https:; style-src 'self' 'unsafe-inline'; script-src 'self'">
<title>Blat</title>
<link rel="icon" href="favicon.png">
<style>
/* język wizualny Gapy: te same zmienne, kolory i proporcje */
:root{--bg:#f7f7f5;--text:#1a1a19;--text2:#4a4945;--muted:#8a8984;--muted2:#a3a29d;--soft:#efeeea;--hover:#ecebe7;--line:#e6e5e1;--card:#fff;--cardline:#ecebe7;--kbd:#f3f2ef;
  --paper:#f2f1ed;--frame:#ebe9e4;--menu:#fff;--menush:0 0 0 1px rgba(0,0,0,.06),0 10px 30px rgba(0,0,0,.10);--scroll:rgba(0,0,0,.16);color-scheme:light}
[data-theme=dark]{--bg:#161616;--text:#e9e9e7;--text2:#c4c4c1;--muted:#8d8d89;--muted2:#6f6f6c;--soft:#222221;--hover:#242423;--line:#2a2a29;--card:#1d1d1c;--cardline:#2a2a29;--kbd:#2e2e2d;
  --paper:#1a1a1a;--frame:#202020;--menu:#232322;--menush:0 0 0 1px rgba(255,255,255,.07),0 12px 36px rgba(0,0,0,.5);--scroll:rgba(255,255,255,.16);color-scheme:dark}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font:13px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;
  display:grid;grid-template-columns:220px minmax(0,1fr);grid-template-rows:52px minmax(0,1fr);overflow:hidden;user-select:none;-webkit-user-select:none}
body.noside{grid-template-columns:0 minmax(0,1fr)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:default}
.ib{width:30px;height:28px;border-radius:7px;display:inline-flex;align-items:center;justify-content:center;color:var(--text2);flex:none}
.ib:hover,.ib.on{background:var(--hover);color:var(--text)}
header{grid-column:1/3;display:flex;align-items:center;gap:6px;padding:0 12px;-webkit-app-region:drag;min-width:0}
header button,header input,header .title b{-webkit-app-region:no-drag}
.frame-mac header{padding-left:84px}
.frame-win header{padding-right:150px}
.title{display:flex;align-items:center;gap:6px;margin-left:12px;font-size:13.5px;min-width:0}
.title .p{color:var(--muted)}.title .s{color:var(--muted2)}
.title b{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:3px 6px;margin:0 -6px;border-radius:6px}
.title b:hover{background:var(--hover)}
.title input{font:inherit;font-weight:500;color:var(--text);background:var(--card);border:0;outline:0;box-shadow:0 0 0 1.5px var(--text);border-radius:6px;padding:3px 6px;margin:0 -6px;width:260px}
.saved{color:var(--muted);font-size:11.5px;margin-left:10px;white-space:nowrap}
.gap{flex:1}
.tools{display:flex;gap:2px;padding:2px;border-radius:9px;background:var(--soft)}
.tools .ib.on{background:var(--card);box-shadow:0 0 0 1px var(--cardline),0 1px 2px rgba(0,0,0,.06)}
.sep{width:1px;height:16px;background:var(--line);margin:0 6px;flex:none}
aside{grid-row:2;overflow:hidden;padding:6px 10px 12px 12px;display:flex;flex-direction:column;min-width:0}
.noside aside{visibility:hidden}
.sh{display:flex;align-items:center;gap:8px;padding:8px 8px 6px;font-size:12px;color:var(--muted)}
.sh .ib{margin-left:auto;width:24px;height:22px}
.nav{list-style:none;margin:0;padding:0;overflow:auto;min-height:0}
.nav li{display:flex;align-items:center;gap:10px;height:30px;padding:0 8px;border-radius:7px;color:var(--text2);white-space:nowrap}
.nav li:hover{background:var(--hover)}
.nav li.on{background:var(--hover);color:var(--text)}
.nav li .nm{overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.nav li .th{width:26px;height:18px;border-radius:3px;background:var(--soft);flex:none;overflow:hidden;display:flex;gap:1px}
.nav li .th i{flex:1;background-size:cover;background-position:center}
.nav li small{color:var(--muted2);font-size:11px;font-variant-numeric:tabular-nums}
.foot{margin-top:auto;display:flex;align-items:center;gap:4px;padding:8px 0 0 4px;color:var(--muted);font-size:11px}
.foot .where{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.foot .where:hover{color:var(--text)}
#upd{font-size:11px;color:var(--text2);padding:2px 7px;border-radius:6px;background:var(--hover);margin:0 0 6px 4px;align-self:flex-start}
main{grid-row:2;position:relative;overflow:hidden;border-top-left-radius:12px;background:var(--paper);box-shadow:inset 0 0 0 1px var(--line);outline:none}
.noside main{border-top-left-radius:0}
#world{position:absolute;left:0;top:0;transform-origin:0 0}
.it{position:absolute}
.it.frame{border-radius:12px;background:var(--frame)}
.it.frame .fl{position:absolute;left:14px;top:9px;font-size:12px;color:var(--muted);white-space:nowrap;transform-origin:0 0}
.it.frame .fl b{font-weight:500;color:var(--text2);margin-right:6px}
.it.image img{display:block;width:100%;height:100%;border-radius:3px;-webkit-user-drag:none;pointer-events:none}
.it.image{border-radius:3px;background:var(--soft)}
.it.note{font-size:13px;line-height:1.5;color:var(--text2);white-space:pre-wrap;word-wrap:break-word;min-height:20px;outline:none}
.it.note:empty::before{content:attr(data-ph);color:var(--muted2)}
.it.note[contenteditable=true]{user-select:text;-webkit-user-select:text;cursor:text;box-shadow:0 0 0 1px var(--line);border-radius:4px;background:var(--card)}
.it.sel{outline:1.5px solid var(--text);outline-offset:3px}
.it.frame.sel{outline-offset:0}
.hd{position:absolute;width:9px;height:9px;background:var(--card);box-shadow:0 0 0 1.5px var(--text);border-radius:2px;z-index:5}
.hd.br{right:-8px;bottom:-8px;cursor:nwse-resize}
#marq{position:absolute;box-shadow:inset 0 0 0 1px var(--muted);background:rgba(128,128,128,.08);border-radius:2px;display:none;pointer-events:none}
.zoom{position:absolute;right:16px;bottom:12px;display:flex;align-items:center;gap:8px;font-size:11px;color:var(--muted);pointer-events:none}
.zoom b{font-weight:400;color:var(--text2)}
.empty{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--muted);text-align:center;pointer-events:none;padding:0 40px}
.empty .big{font-size:15px;color:var(--text2)}
.empty .keys{display:flex;flex-wrap:wrap;justify-content:center;gap:8px 18px;margin-top:10px;font-size:12px}
.empty kbd{font:inherit;font-size:11px;padding:1px 6px;border-radius:4px;background:var(--kbd);color:var(--text2);margin-right:5px}
main.isempty .empty{display:flex}
main.drag::after{content:"";position:absolute;inset:14px;border-radius:14px;box-shadow:inset 0 0 0 1.5px var(--muted2);pointer-events:none}
main.drag .empty{display:flex}
main.panning{cursor:grabbing}
main.space{cursor:grab}
main.tool-note{cursor:text}
main.tool-frame{cursor:crosshair}
#menu{position:fixed;z-index:80;min-width:200px;padding:5px;border-radius:10px;background:var(--menu);box-shadow:var(--menush);display:none}
#menu button{display:flex;align-items:center;justify-content:space-between;gap:20px;width:100%;height:30px;padding:0 10px;border-radius:7px;color:var(--text)}
#menu button:hover{background:var(--hover)}
#menu button kbd{font:inherit;font-size:11px;color:var(--muted)}
#menu button.warn{color:#b3261e}
[data-theme=dark] #menu button.warn{color:#f2867e}
#menu hr{border:0;height:1px;background:var(--line);margin:4px 6px}
#tip{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--text);color:var(--bg);font-size:12px;padding:6px 12px;border-radius:8px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:90}
#tip.on{opacity:.92}
/* tryb bez nawigacji (Tab, jak w Gapie): samo płótno; wąski pasek u góry zostaje na przyciski okna i przesuwanie okna */
body.bare{grid-template-columns:minmax(0,1fr);grid-template-rows:0 minmax(0,1fr)}
.frame-win body.bare{grid-template-rows:36px minmax(0,1fr)}
.fs body.bare{grid-template-rows:0 minmax(0,1fr)}
body.bare::before{content:"";grid-row:1;grid-column:1;-webkit-app-region:drag}
/* na Macu bez paska: płótno do samej góry, niewidoczny pas do przesuwania okna, przyciski okna tylko przy ruchu myszy */
.frame-mac body.bare::before{position:fixed;left:0;right:0;top:0;height:28px;z-index:20}
.fs.frame-mac body.bare::before{display:none}
body.bare header,body.bare aside{display:none}
body.bare main{grid-row:2;grid-column:1;border-radius:0;box-shadow:none}
#fspill{position:fixed;top:10px;right:12px;z-index:60;display:flex;gap:2px;padding:3px;border-radius:10px;background:var(--card);box-shadow:0 0 0 1px var(--cardline),0 6px 20px rgba(0,0,0,.14);opacity:0;pointer-events:none;transition:opacity .2s}
.frame-win body.bare #fspill{top:44px}
.fs.frame-win body.bare #fspill{top:10px}
body.bare.moving #fspill,body.bare #fspill:hover{opacity:1;pointer-events:auto}
.fsb svg+svg,.fs .fsb svg:first-child{display:none}
.fs .fsb svg+svg{display:block}
/* ściąga skrótów (?) — ta sama co w Gapie: klawisze ułożone jak na klawiaturze */
#keys{position:fixed;inset:0;z-index:70;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.28);opacity:0;pointer-events:none;transition:opacity .15s}
/* no-drag tylko gdy widoczne: Electron liczy obszary przeciągania także dla niewidocznych warstw */
#keys.on{opacity:1;pointer-events:auto;-webkit-app-region:no-drag}
body.bare #fspill{-webkit-app-region:no-drag}
#keys .kc{background:var(--card);border-radius:16px;box-shadow:0 0 0 1px var(--cardline),0 24px 60px rgba(0,0,0,.22);padding:24px 26px 22px;max-width:calc(100vw - 40px)}
#keys .kh{display:flex;justify-content:space-between;align-items:baseline;gap:24px;margin-bottom:18px}
#keys .kh b{font-weight:500;font-size:15px;color:var(--text)}
#keys .kh span{font-size:12px;color:var(--muted2)}
#keys .kr{display:flex;gap:6px;margin-bottom:6px}
#keys .k{width:84px;height:62px;border-radius:8px;box-shadow:inset 0 0 0 1px var(--line);padding:7px 8px;display:flex;flex-direction:column;justify-content:space-between;flex:none;box-sizing:border-box}
#keys .k i{font-style:normal;font-size:13px;font-weight:500;color:var(--text)}
#keys .k small{font-size:11px;line-height:1.2;color:var(--muted)}
#keys .k small em{font-style:normal;color:var(--muted2);display:block}
#keys .k.w{width:118px}#keys .k.sp{width:390px}
#keys .km{display:grid;grid-template-columns:1fr 1fr;gap:7px 28px;margin-top:18px;padding-top:14px;border-top:1px solid var(--line);font-size:12px;color:var(--text2)}
#keys .km kbd{font:inherit;font-size:11px;box-shadow:inset 0 0 0 1px var(--line);border-radius:5px;padding:1px 6px;margin-right:7px;color:var(--text);white-space:nowrap}
/* małe okno: blat z referencjami w rogu ekranu; najpierw znika lista blatów, potem wszystko poza płótnem i narzędziami */
@media (max-width:620px){body:not(.bare){grid-template-columns:0 minmax(0,1fr)}aside{visibility:hidden}#sideBtn,.title .p,.title .s,.sep{display:none}.title{margin-left:4px}}
@media (max-width:420px){.title .saved,#zoomHint{display:none}}
@media (max-height:300px){.zoom{bottom:8px;right:10px}}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:var(--scroll);border-radius:4px}
</style>
</head>
<body>
<header>
  <button class="ib" id="sideBtn"></button>
  <div class="title"><span class="p" data-t="Blaty"></span><span class="s">/</span><b id="bname"></b><span class="saved" id="saved"></span></div>
  <div class="gap"></div>
  <div class="tools" id="tools"></div>
  <span class="sep"></span>
  <button class="ib" id="arrangeBtn"></button>
  <button class="ib" id="topBtn"></button>
</header>
<aside>
  <div class="sh"><span data-t="Blaty"></span><button class="ib" id="newBtn"></button></div>
  <ul class="nav" id="boards"></ul>
  <button id="upd" hidden></button>
  <div class="foot"><span class="where" id="where"></span><button class="ib" id="setBtn"></button><button class="ib" id="keysBtn"></button><button class="ib" id="themeBtn"></button></div>
</aside>
<main id="main" tabindex="0">
  <div id="world"></div>
  <div id="marq"></div>
  <div class="empty"><div class="big" id="emptyBig"></div><div id="emptySub"></div><div class="keys" id="emptyKeys"></div></div>
  <div class="zoom"><span id="zoomHint"></span><b id="zoomPct">100%</b></div>
</main>
<div id="fspill"><button class="ib" id="pillUi"></button><button class="ib fsb" id="pillFs"></button></div>
<div id="keys" role="dialog"></div>
<div id="menu"></div>
<div id="tip"></div>
<script src="lang/en.js"></script>
<script src="i18n.js"></script>
<script src="web-api.js"></script>
<script src="app.js"></script>
</body>
</html>
